{% extends "base.html" %}
{% block head %}
{% if folder == "travels" %}<link rel="stylesheet" href="/globe.css" />{% endif %}
{% endblock %}
{% block content %}
<header class="collection-header">
  <a href="/" class="back-link"><span aria-hidden="true">‹</span> Home</a>
  <h1>{{ folder_title }}</h1>
  <p class="collection-count">{{ posts | length }} 件</p>
</header>
<section class="reveal" aria-label="{{ folder_title }}の一覧">
  {{ list_html | safe }}
</section>
<footer class="site-footer reveal">© {{ site.copyright_year }} {{ site.name }}</footer>
{% endblock %}
