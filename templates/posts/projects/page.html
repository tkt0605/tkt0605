{% extends "base.html" %}

{% block content %}
<article class="project-page fade-in">
  <header class="project-page-header">
    <a href="/projects/" class="back-link">← Projects</a>
    <p class="eyebrow">Project</p>
    <h1>{{ post.title }}</h1>
    {% if post.summary %}<p class="project-page-summary">{{ post.summary }}</p>{% endif %}
    {% if post.url %}
    <a class="pill project-page-link" href="{{ post.url }}" target="_blank" rel="noopener noreferrer">
      {{ post.browse or "外部リンク" }} ↗
    </a>
    {% endif %}
  </header>
  {% if post.content %}<div class="card prose-copy project-body">{{ post.content | safe }}</div>{% endif %}
</article>
{% endblock %}
