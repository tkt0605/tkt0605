{% from "_nav_icons.html" import nav_icon %}
<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ffffff" />
    <title>{{ title }}</title>
    <link rel="icon" href="/favicon.ico" type="image/x-icon" />
    <link rel="stylesheet" href="/index.css" />
    <script>document.documentElement.classList.add("js");</script>
    {% block head %}{% endblock %}
  </head>
  <body>
    <a class="skip-link" href="#main">本文へスキップ</a>
    <nav class="nav" aria-label="サイト内ナビゲーション">
      <div class="wrap nav-inner">
        <a class="nav-brand" href="/">{{ site.domain }}</a>
        <div class="nav-links">
          {% for key, label in site.collections.items() %}
          <a
            class="nav-link"
            href="/{{ key }}/"
            title="{{ label }}"
            aria-label="{{ label }}"
            {% if folder is defined and folder == key %}aria-current="page"{% endif %}
          >{{ nav_icon(key) }}</a>
          {% endfor %}
        </div>
      </div>
    </nav>
    <div class="wrap">
      <main class="page-grid" id="main">{% block content %}{% endblock %}</main>
    </div>
    <script>
      (function () {
        var targets = document.querySelectorAll(".reveal");
        if (!("IntersectionObserver" in window) || window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
          Array.prototype.forEach.call(targets, function (el) { el.classList.add("is-visible"); });
          return;
        }
        var observer = new IntersectionObserver(function (entries) {
          entries.forEach(function (entry) {
            if (!entry.isIntersecting) return;
            entry.target.classList.add("is-visible");
            observer.unobserve(entry.target);
          });
        }, { rootMargin: "0px 0px -8% 0px", threshold: 0.08 });
        Array.prototype.forEach.call(targets, function (el) { observer.observe(el); });
      })();
    </script>
  </body>
</html>
